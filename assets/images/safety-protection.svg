<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <linearGradient id="safetyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F243E"/>
      <stop offset="100%" stop-color="#071526"/>
    </linearGradient>
    <linearGradient id="coneYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="hoseBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="450" fill="url(#safetyBg)"/>

  <!-- Wall and Floor Corner Perspective -->
  <polygon points="50,50 350,120 350,380 50,340" fill="#1E293B"/> <!-- Left Wall -->
  <polygon points="350,120 650,50 650,340 350,380" fill="#334155"/> <!-- Right Wall -->
  <polygon points="50,340 350,380 650,340 350,440" fill="#0B1320"/> <!-- Floor -->

  <!-- Wall Baseboard / Zoclo -->
  <polygon points="50,325 350,365 350,380 50,340" fill="#E2E8F0"/>
  <polygon points="350,365 650,325 650,340 350,380" fill="#CBD5E1"/>

  <!-- CORNER GUARD (Esquinero Protector de Pared) in Vibrant Blue / High Tech -->
  <g transform="translate(325, 230)">
    <!-- Vertical Corner Guard Plate -->
    <path d="M 0,0 L 25,10 L 50,0 L 50,140 L 25,150 L 0,140 Z" fill="#0284C7" stroke="#38BDF8" stroke-width="3"/>
    <text x="25" y="60" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="900" font-size="10" text-anchor="middle">CORNER</text>
    <text x="25" y="75" fill="#FDE68A" font-family="'Outfit', sans-serif" font-weight="900" font-size="10" text-anchor="middle">GUARD</text>
    <!-- Smooth roller wheel for hose glide -->
    <circle cx="25" cy="115" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="25" cy="115" r="5" fill="#1E293B"/>
  </g>

  <!-- Vacuum Extraction Hose Gliding Around Corner -->
  <path d="M 120,420 Q 250,380 345,345 Q 400,320 540,350" fill="none" stroke="url(#hoseBlue)" stroke-width="24" stroke-linecap="round"/>
  <path d="M 120,420 Q 250,380 345,345 Q 400,320 540,350" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 10"/>

  <!-- SAFETY CAUTION CONE (Señalamiento de Precaución Piso Mojado) -->
  <g transform="translate(480, 200)">
    <!-- Base Plate -->
    <ellipse cx="60" cy="190" rx="45" ry="15" fill="#B45309"/>
    <!-- Cone Body -->
    <polygon points="60,20 25,185 95,185" fill="url(#coneYellow)"/>
    <!-- Reflective Stripes -->
    <polygon points="50,70 70,70 76,100 44,100" fill="#FFFFFF"/>
    <polygon points="41,115 79,115 86,145 34,145" fill="#FFFFFF"/>
    <!-- Caution Symbol & Text -->
    <path d="M 60,82 L 53,96 L 67,96 Z" fill="#D97706"/>
    <text x="60" y="165" fill="#000000" font-family="'Outfit', sans-serif" font-weight="800" font-size="9" text-anchor="middle">CAUTION</text>
    <text x="60" y="175" fill="#000000" font-family="'Outfit', sans-serif" font-weight="700" font-size="7" text-anchor="middle">WET FLOOR</text>
  </g>

  <!-- Insured / Trust Shield Badge -->
  <g transform="translate(100, 100)">
    <circle cx="45" cy="45" r="40" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="2"/>
    <path d="M 45,20 L 70,30 L 70,55 Q 70,75 45,85 Q 20,75 20,55 L 20,30 Z" fill="#F59E0B"/>
    <path d="M 35,50 L 42,57 L 57,40" fill="none" stroke="#071526" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="45" y="105" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle">100% ASEGURADOS</text>
  </g>
</svg>
