<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="cleanTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#EADBCC"/>
    </linearGradient>
    <linearGradient id="tileGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="tileSparkle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Clean bright Grout Grid Base -->
  <rect width="800" height="550" fill="#EAE5DB"/>

  <!-- Pristine Tiles -->
  <g stroke="#E0D7C9" stroke-width="6">
    <!-- Row 1 -->
    <rect x="20" y="20" width="170" height="150" rx="4" fill="url(#cleanTile)"/>
    <rect x="210" y="20" width="170" height="150" rx="4" fill="url(#cleanTile)"/>
    <rect x="400" y="20" width="170" height="150" rx="4" fill="url(#cleanTile)"/>
    <rect x="590" y="20" width="190" height="150" rx="4" fill="url(#cleanTile)"/>

    <!-- Row 2 -->
    <rect x="20" y="190" width="170" height="150" rx="4" fill="url(#cleanTile)"/>
    <rect x="210" y="190" width="170" height="150" rx="4" fill="url(#cleanTile)"/>
    <rect x="400" y="190" width="170" height="150" rx="4" fill="url(#cleanTile)"/>
    <rect x="590" y="190" width="190" height="150" rx="4" fill="url(#cleanTile)"/>

    <!-- Row 3 -->
    <rect x="20" y="360" width="170" height="170" rx="4" fill="url(#cleanTile)"/>
    <rect x="210" y="360" width="170" height="170" rx="4" fill="url(#cleanTile)"/>
    <rect x="400" y="360" width="170" height="170" rx="4" fill="url(#cleanTile)"/>
    <rect x="590" y="360" width="190" height="170" rx="4" fill="url(#cleanTile)"/>
  </g>

  <!-- Glossy Reflections across tiles -->
  <polygon points="20,20 190,20 100,170 20,170" fill="url(#tileGleam)"/>
  <polygon points="210,20 380,20 290,170 210,170" fill="url(#tileGleam)"/>
  <polygon points="400,20 570,20 480,170 400,170" fill="url(#tileGleam)"/>
  
  <polygon points="210,190 380,190 290,340 210,340" fill="url(#tileGleam)"/>
  <polygon points="400,190 570,190 480,340 400,340" fill="url(#tileGleam)"/>

  <!-- Clean bright grout lines -->
  <line x1="20" y1="180" x2="780" y2="180" stroke="#FAF7F2" stroke-width="8"/>
  <line x1="20" y1="350" x2="780" y2="350" stroke="#FAF7F2" stroke-width="8"/>
  <line x1="200" y1="20" x2="200" y2="530" stroke="#FAF7F2" stroke-width="8"/>
  <line x1="390" y1="20" x2="390" y2="530" stroke="#FAF7F2" stroke-width="8"/>
  <line x1="580" y1="20" x2="580" y2="530" stroke="#FAF7F2" stroke-width="8"/>

  <!-- Sparkles -->
  <g fill="#F59E0B" filter="url(#tileSparkle)">
    <polygon points="300,165 304,173 312,177 304,181 300,189 296,181 288,177 296,173"/>
    <polygon points="490,335 493,341 499,344 493,347 490,353 487,347 481,344 487,341"/>
    <polygon points="120,330 124,338 132,342 124,346 120,354 116,346 108,342 116,338"/>
  </g>
</svg>
