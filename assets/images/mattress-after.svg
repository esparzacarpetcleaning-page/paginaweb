<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="mattressWhiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <filter id="sanitizedSparkle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="550" fill="#F1F5F9"/>

  <!-- Mattress Perspective Block -->
  <g transform="translate(100, 60)">
    <!-- Quilted Top Surface (Pure White Restored) -->
    <polygon points="120,40 540,40 460,320 40,320" fill="url(#mattressWhiteGrad)" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Mattress Side Border -->
    <polygon points="40,320 460,320 460,380 40,380" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
    <polygon points="460,320 540,40 540,100 460,380" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2"/>

    <!-- Diamond Quilted Pattern (Clean & Defined) -->
    <path d="M 160,80 L 420,80 M 130,140 L 440,140 M 100,200 L 440,200 M 70,260 L 450,260" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.6"/>
    <path d="M 180,40 L 100,320 M 260,40 L 180,320 M 340,40 L 260,320 M 420,40 L 340,320 M 500,40 L 420,320" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.6"/>

    <!-- Quilted Buttons / Tufts -->
    <circle cx="210" cy="140" r="4" fill="#CBD5E1"/>
    <circle cx="290" cy="140" r="4" fill="#CBD5E1"/>
    <circle cx="370" cy="140" r="4" fill="#CBD5E1"/>
    <circle cx="170" cy="200" r="4" fill="#CBD5E1"/>
    <circle cx="250" cy="200" r="4" fill="#CBD5E1"/>
    <circle cx="330" cy="200" r="4" fill="#CBD5E1"/>
    <circle cx="410" cy="200" r="4" fill="#CBD5E1"/>

    <!-- Sparkles of Sanitization -->
    <g fill="#F59E0B" filter="url(#sanitizedSparkle)">
      <polygon points="230,160 234,168 242,172 234,176 230,184 226,176 218,172 226,168"/>
      <polygon points="360,200 363,206 369,209 363,212 360,218 357,212 351,209 357,206"/>
    </g>
    <g fill="#0EA5E9" opacity="0.8">
      <circle cx="280" cy="120" r="4"/>
      <circle cx="150" cy="250" r="3.5"/>
    </g>
  </g>
</svg>
