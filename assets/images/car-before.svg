<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="carSeatDirty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555B66"/>
      <stop offset="100%" stop-color="#3A3F47"/>
    </linearGradient>
    <radialGradient id="carStain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#211A12" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#3B3024" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3A3F47" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="waterRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3A3F47" stop-opacity="0"/>
      <stop offset="70%" stop-color="#27221A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3A3F47" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Car Interior Cabin BG -->
  <rect width="800" height="550" fill="#1E232A"/>

  <!-- Left Car Seat -->
  <g transform="translate(100, 50)">
    <!-- Headrest -->
    <rect x="75" y="20" width="130" height="90" rx="25" fill="#4B515C" stroke="#2D323A" stroke-width="3"/>
    <rect x="110" y="105" width="14" height="25" fill="#94A3B8"/>
    <rect x="155" y="105" width="14" height="25" fill="#94A3B8"/>

    <!-- Backrest with side bolsters -->
    <path d="M 40,130 Q 20,220 30,320 L 250,320 Q 260,220 240,130 Z" fill="url(#carSeatDirty)" stroke="#2D323A" stroke-width="3"/>
    <rect x="70" y="140" width="140" height="170" rx="10" fill="#424852"/>

    <!-- Seat Cushion -->
    <polygon points="20,330 260,330 280,440 0,440" fill="url(#carSeatDirty)" stroke="#2D323A" stroke-width="3"/>

    <!-- Stains on seat -->
    <ellipse cx="140" cy="380" rx="60" ry="35" fill="url(#carStain)"/>
    <ellipse cx="150" cy="230" rx="45" ry="30" fill="url(#carStain)"/>
    <circle cx="100" cy="370" r="30" fill="url(#waterRing)"/>
  </g>

  <!-- Right Car Seat -->
  <g transform="translate(420, 50)">
    <!-- Headrest -->
    <rect x="75" y="20" width="130" height="90" rx="25" fill="#4B515C" stroke="#2D323A" stroke-width="3"/>
    <rect x="110" y="105" width="14" height="25" fill="#94A3B8"/>
    <rect x="155" y="105" width="14" height="25" fill="#94A3B8"/>

    <!-- Backrest -->
    <path d="M 40,130 Q 20,220 30,320 L 250,320 Q 260,220 240,130 Z" fill="url(#carSeatDirty)" stroke="#2D323A" stroke-width="3"/>
    <rect x="70" y="140" width="140" height="170" rx="10" fill="#424852"/>

    <!-- Seat Cushion -->
    <polygon points="20,330 260,330 280,440 0,440" fill="url(#carSeatDirty)" stroke="#2D323A" stroke-width="3"/>

    <!-- Dark Coffee / Mud Stains -->
    <ellipse cx="120" cy="390" rx="70" ry="40" fill="url(#carStain)"/>
    <ellipse cx="160" cy="220" rx="50" ry="35" fill="url(#carStain)"/>
  </g>
</svg>
