<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="glassFacade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="sunReflect" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="450" fill="url(#skyGrad)"/>

  <!-- Commercial Buildings Silhouette -->
  <rect x="40" y="140" width="120" height="310" fill="#334155"/>
  <rect x="420" y="100" width="140" height="350" fill="#1E293B"/>

  <!-- Main Commercial Glass Office Center -->
  <g transform="translate(140, 60)">
    <rect x="0" y="0" width="300" height="390" fill="url(#glassFacade)" stroke="#475569" stroke-width="3"/>

    <!-- Glass Panels Grid -->
    <g stroke="#38BDF8" stroke-width="1.5" opacity="0.4">
      <line x1="60" y1="0" x2="60" y2="390"/>
      <line x1="120" y1="0" x2="120" y2="390"/>
      <line x1="180" y1="0" x2="180" y2="390"/>
      <line x1="240" y1="0" x2="240" y2="390"/>

      <line x1="0" y1="60" x2="300" y2="60"/>
      <line x1="0" y1="120" x2="300" y2="120"/>
      <line x1="0" y1="180" x2="300" y2="180"/>
      <line x1="0" y1="240" x2="300" y2="240"/>
      <line x1="0" y1="300" x2="300" y2="300"/>
    </g>

    <!-- Glass Reflection Angle -->
    <polygon points="40,0 120,0 20,390 0,390" fill="url(#sunReflect)"/>
    <polygon points="160,0 240,0 140,390 60,390" fill="url(#sunReflect)"/>

    <!-- Modern Entrance Canopy -->
    <rect x="75" y="320" width="150" height="70" fill="#0B1F36" stroke="#F59E0B" stroke-width="2"/>
    <rect x="110" y="335" width="80" height="55" fill="#38BDF8" opacity="0.7"/>
  </g>
</svg>
