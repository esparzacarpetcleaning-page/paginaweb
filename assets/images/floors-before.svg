<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="dirtyTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F8275"/>
      <stop offset="50%" stop-color="#A19487"/>
      <stop offset="100%" stop-color="#807366"/>
    </linearGradient>
    <radialGradient id="mudSpread" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D2E20" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#5E4935" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#807366" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="550" fill="#2B2117"/>

  <!-- Tile Grid (4x3 tiles in perspective) -->
  <g stroke="#1F160E" stroke-width="14">
    <!-- Tiles Row 1 -->
    <rect x="20" y="20" width="170" height="150" fill="url(#dirtyTile)"/>
    <rect x="210" y="20" width="170" height="150" fill="url(#dirtyTile)"/>
    <rect x="400" y="20" width="170" height="150" fill="url(#dirtyTile)"/>
    <rect x="590" y="20" width="190" height="150" fill="url(#dirtyTile)"/>

    <!-- Tiles Row 2 -->
    <rect x="20" y="190" width="170" height="150" fill="url(#dirtyTile)"/>
    <rect x="210" y="190" width="170" height="150" fill="url(#dirtyTile)"/>
    <rect x="400" y="190" width="170" height="150" fill="url(#dirtyTile)"/>
    <rect x="590" y="190" width="190" height="150" fill="url(#dirtyTile)"/>

    <!-- Tiles Row 3 -->
    <rect x="20" y="360" width="170" height="170" fill="url(#dirtyTile)"/>
    <rect x="210" y="360" width="170" height="170" fill="url(#dirtyTile)"/>
    <rect x="400" y="360" width="170" height="170" fill="url(#dirtyTile)"/>
    <rect x="590" y="360" width="190" height="170" fill="url(#dirtyTile)"/>
  </g>

  <!-- Grimy blackened grout overlays -->
  <line x1="20" y1="180" x2="780" y2="180" stroke="#1A120B" stroke-width="12"/>
  <line x1="20" y1="350" x2="780" y2="350" stroke="#140E08" stroke-width="12"/>
  <line x1="200" y1="20" x2="200" y2="530" stroke="#140E08" stroke-width="12"/>
  <line x1="390" y1="20" x2="390" y2="530" stroke="#1A120B" stroke-width="12"/>
  <line x1="580" y1="20" x2="580" y2="530" stroke="#140E08" stroke-width="12"/>

  <!-- Heavy traffic mud stains -->
  <ellipse cx="380" cy="270" rx="200" ry="120" fill="url(#mudSpread)"/>
  <ellipse cx="250" cy="340" rx="140" ry="80" fill="url(#mudSpread)"/>
  <ellipse cx="500" cy="220" rx="130" ry="70" fill="url(#mudSpread)"/>
</svg>
